<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manageme-app</title>
  </head>
  <body>
    <div id="app">
    <h1>Manage me</h1>
    
    <header id="app-header">
      <div id="user-display"></div>
    </header>

    <form id="project-form">
      <input type="hidden" id="project-id">
      <input type="text" id="project-name" placeholder="Project name" required>
      <textarea type="text" id="project-desc" placeholder="Project description"></textarea>

      <button type="submit" id="submit-btn">Save Project</button>
    </form>

    <!-- горизонтальная линия -->
    <hr> 

    <h2>Project list</h2>

    <div id="project-list"></div>

    

    <section id="stories-section" style="display: none;"> <hr>
      <h2>Project's tasks <span id="active-project-name"></span></h2>

      <form id="story-form">
        <input type="hidden" id="story-id">
        <input type="text" id="story-name" placeholder="Task title" required>
        <textarea id="story-desc" placeholder="Task description"></textarea>

        <div class="form-row">
          <select id="story-priority">
            <option value="low">low priority</option>
            <option value="medium" selected>medium priority</option>
            <option value="high">high priority</option>
          </select>

          <select id="story-status">
            <option value="todo">to do</option>
            <option value="doing">in progress</option>
            <option value="done">done</option>
          </select>
        </div>

        <button type="submit" id="save-story-btn">Add Task</button>

      </form>

      <div class="kanban-board">
        <div class="column" id="col-todo">
          <h3>Need to be done <span>(0)</span></h3>
          <div class="story-list"></div>
        </div>
        <div class="column" id="col-doing">
          <h3>in progress <span>(0)</span></h3>
          <div class="story-list"></div>
        </div>
        <div class="column" id="col-done">
          <h3>Done <span>(0)</span></h3>
          <div class="story-list"></div>
        </div>
      </div>
    </section>
</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
